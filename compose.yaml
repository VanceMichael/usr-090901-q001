services:
  # 原脚手架契约自检（无外部依赖）
  scaffold-check:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: node /workspace/scaffold/validate.mjs

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unboxing-report-dispatch:local
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      SQLITE_PATH: /data/dispatch.db
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  # 容器内黑盒：docker compose run --rm blackbox suite|pre|post
  # 镜像由 app 服务构建（先 docker compose build app 或 up -d app）
  blackbox:
    image: unboxing-report-dispatch:local
    working_dir: /app
    environment:
      BASE_URL: http://app:8080
      RUN_ID: bb
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "scripts/blackbox.mjs"]
    command: ["suite"]

volumes:
  app-data:
